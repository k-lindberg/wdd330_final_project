<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Set Collector - Wishlist</title>
    <meta name="author" content="Kristin Lindberg">
    <meta name="description"
        content="This app is to help you keep track of the Lego Sets you own, as well as a Wishlist for sets you want.">
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/wishlist.mjs"></script>
</head>

<body>
    <header id="header"></header>
    <main>

        <section>
            <h1>Your Wishlist</h1>
            <p>This is where you can see all the sets you would like to aquire.</p>
        </section>

        <div id="wishlistCards"></div>

    </main>

    <dialog id="setModal">
        <div id="modalContent"></div>
        <button type="button" id="closeBtn">X</button>
    </dialog>

    <footer id="footer"></footer>
</body>

</html>
