<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Set Collector - Home</title>
    <meta name="author" content="Kristin Lindberg">
    <meta name="description"
        content="This app is to help you keep track of the Lego Sets you own, as well as a Wishlist for sets you want.">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.mjs"></script>
</head>

<body>
    <header id="header"></header>
    <main>

        <section class="intro">
            <h1>Lego Set Collector</h1>
            <p>Welcome to the Lego Set Collector App! Here you can filter sets by theme, save the sets you own to a list, and save a Wishlist. Also, click the "Surprise Me!" Button to be shown a random Lego set!</p>
            <button type="button" id="surpriseBtn">Surprise Me!</button>
        </section>

        <div class="section-divider"></div>

        <div>
            <label>Theme: 
                <select name="theme" id="themeSelect"></select>
            </label>
        </div>

        <section id="setList" class="set-list"></section>

    </main>

    <dialog id="setModal">
        <div class="detailWrapper">
            <button type="button" id="closeBtn">x</button>
            <div id="modalContent"></div> 
        </div>
    </dialog>

    <dialog id="surpriseModal">
        <div class="surpriseWrapper">
            <button type="button" id="surpriseCloseBtn">x</button>
            <div id="surpriseContent"></div>
        </div>
    </dialog>

    <footer id="footer"></footer>
</body>

</html>
